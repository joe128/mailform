name: Release & Docker Build

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      docker_registry:
        description: 'choose Docker-Registry'
        required: true
        default: 'dockerhub'
        type: choice
        options:
          - 'ghcr'
          - 'dockerhub'
      docker_tag:
        description: 'Docker Image Tag (Default Version from package.json)'
        required: false
        default: ''
        type: string

jobs:
  release:
    if: github.event_name == 'push' && github.repository == 'feuerhamster/mailform'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'push' && needs.release.outputs.new_release_published == 'true')
      )
    needs: release
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: ${{ inputs.docker_registry || 'dockerhub' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define Image-Name in lowercase
        id: get-image-name
        run: |
          if [ "${{ env.DOCKER_REGISTRY }}" = "ghcr" ]; then
            RAW_NAME="${{ github.repository }}"
          else
            RAW_NAME="${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}"
          fi
          echo "IMAGE_NAME=${RAW_NAME,,}" >> $GITHUB_OUTPUT

      - name: Check if base image has updates
        id: image-update-checker
        if: github.event_name == 'schedule'
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: library/node:lts-alpine
          image: ${{ env.DOCKER_REGISTRY == 'ghcr' && 'ghcr.io/' || '' }}${{ steps.get-image-name.outputs.IMAGE_NAME }}:latest

      - name: Determine if build is needed
        id: build_check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.image-update-checker.outputs.needs-updating }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Skip Build: No Changes in Base-Image."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Version Tag
        if: steps.build_check.outputs.should_build == 'true'
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG=${{ needs.release.outputs.new_release_version }}" >> $GITHUB_OUTPUT
            echo "Using release Version: ${{ needs.release.outputs.new_release_version }}"
          elif [ -n "${{ github.event.inputs.docker_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.docker_tag }}" >> $GITHUB_OUTPUT
            echo "Using choosen Version: ${{ github.event.inputs.docker_tag }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "TAG=$VERSION" >> $GITHUB_OUTPUT
            echo "Using Version from package.json: $VERSION"
          fi

      - name: Set up QEMU
        if: steps.build_check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.build_check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.build_check.outputs.should_build == 'true' && env.DOCKER_REGISTRY == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.build_check.outputs.should_build == 'true' && env.DOCKER_REGISTRY == 'dockerhub'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Define Docker Tags
        if: steps.build_check.outputs.should_build == 'true'
        id: meta
        run: |
          if [ "${{ env.DOCKER_REGISTRY }}" = "ghcr" ]; then
            TAGS="ghcr.io/${{ steps.get-image-name.outputs.IMAGE_NAME }}:${{ steps.versioning.outputs.TAG }}"
            TAGS="$TAGS,ghcr.io/${{ steps.get-image-name.outputs.IMAGE_NAME }}:latest"
          else
            TAGS="${{ steps.get-image-name.outputs.IMAGE_NAME }}:${{ steps.versioning.outputs.TAG }}"
            TAGS="$TAGS,${{ steps.get-image-name.outputs.IMAGE_NAME }}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        if: steps.build_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
