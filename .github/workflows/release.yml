name: Release & Docker Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker Image Tag (Default Version from package.json)'
        required: false
        default: ''
        type: string

jobs:
  release:
    if: github.event_name == 'push' && github.repository == 'feuerhamster/mailform'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: |
      (github.event_name == 'push' && needs.release.outputs.new_release_published == 'true') ||
      (github.event_name == 'workflow_dispatch')
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG=${{ needs.release.outputs.new_release_version }}" >> $GITHUB_OUTPUT
            echo "Using release Version: ${{ needs.release.outputs.new_release_version }}"
          elif [ -n "${{ github.event.inputs.docker_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.docker_tag }}" >> $GITHUB_OUTPUT
            echo "Using choosen Version: ${{ github.event.inputs.docker_tag }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "TAG=$VERSION" >> $GITHUB_OUTPUT
            echo "Using Version from package.json: $VERSION"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo-string.outputs.REPO }}:${{ steps.versioning.outputs.TAG }}
            ghcr.io/${{ steps.repo-string.outputs.REPO }}:latest
